name: Cyoria Folia Auto Release

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: cyoria-folia-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ false }} # Fail closed until exact-commit Folia 1.21.11 runtime evidence is available
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify exact-commit Folia 1.21.11 runtime evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&status=completed&per_page=100" > runtime-runs.json
          jq -e --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" '
            [.workflow_runs[] | select(
              .head_sha == $sha and
              .conclusion == "success" and
              .name == "Folia 1.21.11 Runtime Test" and
              .repository.full_name == $repo
            )] | length > 0
          ' runtime-runs.json >/dev/null || {
            echo "No successful Folia 1.21.11 Runtime Test run exists for this exact commit. Release blocked."
            exit 1
          }
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon
      - name: Collect distributable JARs
        shell: bash
        run: |
          mkdir -p release-assets
          find . -type f \( -path '*/build/libs/*.jar' -o -path './target/*.jar' -o -path '*/target/*.jar' \) \
            ! -iname '*-sources.jar' ! -iname '*-javadoc.jar' \
            ! -iname '*-tests.jar' ! -iname '*-test.jar' \
            ! -iname '*-plain.jar' ! -iname '*-api.jar' \
            ! -path '*/.gradle/*' -print0 |
          while IFS= read -r -d '' file; do
            base="$(basename "$file")"
            if [[ -e "release-assets/$base" ]]; then
              base="$(echo "$file" | sed 's@^./@@; s@/@-@g')"
            fi
            cp "$file" "release-assets/$base"
          done
          test "$(find release-assets -name '*.jar' | wc -l)" -gt 0
          ls -lah release-assets
      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short_sha="${GITHUB_SHA:0:12}"
          tag="cyoria-folia-${GITHUB_RUN_NUMBER}-${short_sha}"
          gh release create "$tag" release-assets/*.jar \
            --target "$GITHUB_SHA" \
            --title "FAWE-Folia build ${GITHUB_RUN_NUMBER}" \
            --notes "Automated CyoriaSMP Folia development build from commit ${GITHUB_SHA}. Compatibility with Folia must be verified before production deployment." \
            --prerelease
