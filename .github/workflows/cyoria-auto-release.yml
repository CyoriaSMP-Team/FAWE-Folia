name: Cyoria Folia Auto Release

on:
  workflow_run:
    workflows: ['Folia 1.21.11 Runtime Smoke Test']
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: cyoria-folia-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'folia/1.21.11' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Verify runtime test commit
        shell: bash
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test "${{ github.event.workflow_run.event }}" != "pull_request"
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon
      - name: Collect distributable JARs
        shell: bash
        run: |
          mkdir -p release-assets
          find . -type f \( -path '*/build/libs/*.jar' -o -path './target/*.jar' -o -path '*/target/*.jar' \) \
            ! -iname '*-sources.jar' ! -iname '*-javadoc.jar' \
            ! -iname '*-tests.jar' ! -iname '*-test.jar' \
            ! -iname '*-plain.jar' ! -iname '*-api.jar' \
            ! -path '*/.gradle/*' -print0 |
          while IFS= read -r -d '' file; do
            base="$(basename "$file")"
            if [[ -e "release-assets/$base" ]]; then
              base="$(echo "$file" | sed 's@^./@@; s@/@-@g')"
            fi
            cp "$file" "release-assets/$base"
          done
          test "$(find release-assets -name '*.jar' | wc -l)" -gt 0
          ls -lah release-assets
      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target_sha="${{ github.event.workflow_run.head_sha }}"
          short_sha="${target_sha:0:12}"
          tag="cyoria-folia-${GITHUB_RUN_NUMBER}-${short_sha}"
          gh release create "$tag" release-assets/*.jar \
            --target "$target_sha" \
            --title "FAWE-Folia build ${GITHUB_RUN_NUMBER}" \
            --notes "Automated CyoriaSMP Folia development build from commit ${target_sha}. Compatibility with Folia must be verified before production deployment." \
            --prerelease
